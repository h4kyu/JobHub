[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhub"
version = "0.1.0"
description = "Local, Claude-assisted internship search, evaluation, and tracking engine"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "trafilatura>=1.9",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
jobhub = "jobhub.cli:app"

[tool.setuptools.packages.find]
include = ["jobhub*"]

[tool.setuptools.package-data]
jobhub = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
